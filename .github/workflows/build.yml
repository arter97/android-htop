name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ncurses_version:
        description: "Pin an ncurses version (empty = latest release)"
        required: false
      htop_version:
        description: "Pin an htop version tag (empty = latest release)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    env:
      # Runners preinstall an older NDK; ignore it and use the latest release.
      ANDROID_NDK_HOME: ""
      ANDROID_NDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4

      # tic/infocmp compile the fallback terminfo entries into libncurses.
      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ncurses-bin ncurses-term unzip xz-utils

      - name: Resolve latest NDK
        id: ndk
        run: echo "name=$(./build.sh --resolve-ndk)" >> "$GITHUB_OUTPUT"

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: build/ndk
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.name }}

      - name: Build
        env:
          ABIS: ${{ matrix.abi }}
          NCURSES_VERSION: ${{ inputs.ncurses_version }}
          HTOP_VERSION: ${{ inputs.htop_version }}
        run: |
          # Reuse the cached NDK unpacked by an earlier run, if there is one.
          ndk=$(echo build/ndk/android-ndk-*)
          if [ -d "$ndk" ]; then
            export ANDROID_NDK_HOME="$GITHUB_WORKSPACE/$ndk"
          fi
          ./build.sh

      - name: Stage artifact
        run: |
          mkdir -p out
          cp dist/${{ matrix.abi }}/htop out/htop-${{ matrix.abi }}
          cp dist/versions.txt out/
          {
            echo '### htop for `${{ matrix.abi }}`'
            echo '```'
            cat dist/versions.txt
            file out/htop-${{ matrix.abi }}
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: htop-${{ matrix.abi }}
          path: out/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          cp artifacts/htop-*/htop-* release/
          cp artifacts/htop-arm64-v8a/versions.txt release/versions.txt
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release/versions.txt
          generate_release_notes: true
