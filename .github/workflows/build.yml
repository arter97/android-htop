name: build

on:
  push:
    branches: ["**"]
    # Release tags are v<htop version>-<revision>, e.g. v3.5.3-0.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ncurses_version:
        description: "Pin an ncurses version (empty = latest release)"
        required: false
      htop_version:
        description: "Pin an htop version tag (empty = latest release)"
        required: false
  # Called by upstream.yml when htop cuts a release. A tag pushed with
  # GITHUB_TOKEN cannot trigger a workflow, so the watcher calls us directly
  # and we create the tag along with the release.
  workflow_call:
    inputs:
      ncurses_version:
        type: string
        required: false
      htop_version:
        type: string
        required: false
      release_tag:
        description: "Publish a release at this tag, e.g. v3.5.3-0"
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: arm64
          - abi: armeabi-v7a
            arch: arm32
    env:
      # Runners preinstall an older NDK; ignore it and use the latest release.
      ANDROID_NDK_HOME: ""
      ANDROID_NDK_ROOT: ""
    steps:
      - uses: actions/checkout@v7

      # tic/infocmp compile the fallback terminfo entries into libncurses.
      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ncurses-bin ncurses-term unzip xz-utils

      # A v<htop version>-<revision> tag pins the htop it names, so the assets
      # cannot end up disagreeing with the tag they were released under.
      - name: Resolve htop version
        id: htop
        run: |
          version="${{ inputs.htop_version }}"
          tag="${{ inputs.release_tag }}"
          case "$GITHUB_REF" in
            refs/tags/v*) tag="${GITHUB_REF#refs/tags/}" ;;
          esac
          if [ -z "$version" ] && [ -n "$tag" ]; then
            version="${tag#v}"
            version="${version%-*}"
            echo "tag $tag pins htop $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve latest NDK
        id: ndk
        run: echo "name=$(./build.sh --resolve-ndk)" >> "$GITHUB_OUTPUT"

      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: build/ndk
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.name }}

      - name: Build
        env:
          ABIS: ${{ matrix.abi }}
          NCURSES_VERSION: ${{ inputs.ncurses_version }}
          HTOP_VERSION: ${{ steps.htop.outputs.version }}
        run: |
          # Reuse the cached NDK unpacked by an earlier run, if there is one.
          ndk=$(echo build/ndk/android-ndk-*)
          if [ -d "$ndk" ]; then
            export ANDROID_NDK_HOME="$GITHUB_WORKSPACE/$ndk"
          fi
          ./build.sh

      - name: Stage artifact
        run: |
          version="$(sed -n 's/^htop=//p' dist/versions.txt)"
          name="htop-$version-${{ matrix.arch }}"
          mkdir -p out
          cp "dist/${{ matrix.abi }}/htop" "out/$name"
          cp dist/versions.txt out/
          {
            echo "### \`$name\`"
            echo '```'
            cat dist/versions.txt
            file "out/$name"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: htop-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  release:
    needs: build
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          cp artifacts/htop-*/htop-*-arm* release/
          cp artifacts/htop-arm64/versions.txt release/versions.txt
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          # Created at the current commit when called by the watcher; already
          # present when this run came from a tag push.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release/htop-*
          body_path: release/versions.txt
          generate_release_notes: true
